<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" />
    <title>RKZFPS: otimização de PC com diagnóstico e medição</title>
    <meta name="description" content="O RKZFPS analisa seu PC, aplica só otimizações compatíveis com backup e desfazer, e mede o resultado antes e depois. Sem tweak placebo, sem promessa de FPS." data-rh="true" />
    <meta property="og:title" content="RKZFPS: seu PC pode estar entregando menos do que deveria" />
    <meta property="og:description" content="Diagnóstico, otimização compatível, medição e transparência." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fonte do proprio dominio, pre-carregada junto com o CSS (padrao do Pickia). -->
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Tema salvo aplicado ANTES do React: quem escolheu o claro nao ve um
         flash escuro a cada visita. A chave e' a mesma de src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          if ((localStorage.getItem('rkzfps_theme') || localStorage.getItem('fpsx_theme')) === 'light') {
            document.documentElement.dataset.theme = 'light'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
